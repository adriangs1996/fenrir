<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diff Router Bar - Variant 7 - Sidebar Control Tower</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .window {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .thin-topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: #10151d;
      }

      .wide-workbench {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        min-height: 690px;
      }

      .control-sidebar {
        min-width: 0;
        border-right: 1px solid var(--line);
        background: #0f141b;
      }

      .control-head {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }

      .repo-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151c26;
      }

      .mode-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .mode-card {
        display: grid;
        gap: 3px;
        min-height: 58px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111820;
        color: var(--muted);
        text-align: left;
      }

      .mode-card.active {
        border-color: rgba(119, 168, 255, 0.45);
        background: #172333;
        color: #edf5ff;
      }

      .action-section {
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .action-stack {
        display: grid;
        gap: 6px;
      }

      .action-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111820;
        color: #dce6f4;
        text-align: left;
      }

      .action-row.disabled {
        color: #657386;
      }

      .action-row.danger {
        color: #ffb8b8;
      }

      .file-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: #0f141b;
      }

      .workspace-only {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
      }

      @media (max-width: 980px) {
        .wide-workbench {
          grid-template-columns: 1fr;
        }

        .control-sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="window">
        <header class="thin-topbar">
          <div class="row grow">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3v12"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="6" cy="6" r="3"></circle>
              <path d="M18 6a3 3 0 1 0-3 3"></path>
              <path d="M6 15c4 0 9-3 9-6"></path>
            </svg>
            <span class="truncate mono">/Users/adriangonzalez/sandbox/t3code</span>
          </div>
          <button class="chip positive" type="button">Stage all</button>
          <button class="icon-button" type="button" title="Refresh">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7"></path>
              <path d="M3 12a9 9 0 0 1 15.1-6.6"></path>
              <path d="M21 3v6h-6"></path>
              <path d="M3 21v-6h6"></path>
            </svg>
          </button>
        </header>

        <div class="wide-workbench">
          <aside class="control-sidebar">
            <div class="control-head">
              <button class="repo-card" type="button">
                <span class="status-dot"></span>
                <span class="stack">
                  <span class="label truncate mono">t3code</span>
                  <span class="sub mono">master - remote synced</span>
                </span>
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <div class="mode-grid">
                <button class="mode-card active" type="button">
                  <span class="label">Worktree</span><span class="sub">0 files</span>
                </button>
                <button class="mode-card" type="button">
                  <span class="label">PR Stack</span><span class="sub">Checks and threads</span>
                </button>
                <button class="mode-card" type="button">
                  <span class="label">History</span><span class="sub">Cherry-pick / revert</span>
                </button>
                <button class="mode-card" type="button">
                  <span class="label">Stashes</span><span class="sub">Apply / pop / drop</span>
                </button>
              </div>
            </div>

            <section class="action-section">
              <div class="section-title"><span>Git</span><span>7</span></div>
              <div class="action-stack">
                <button class="action-row" type="button">
                  <span>✓</span><span>Stage all</span><span class="badge">0</span>
                </button>
                <button class="action-row" type="button">
                  <span>↶</span><span>Unstage all</span><span class="badge">0</span>
                </button>
                <button class="action-row" type="button">
                  <span>□</span><span>Stash changes</span><span></span>
                </button>
                <button class="action-row disabled" type="button">
                  <span>●</span><span>Commit staged</span><span></span>
                </button>
                <button class="action-row disabled" type="button">
                  <span>A</span><span>Amend</span><span></span>
                </button>
                <button class="action-row" type="button">
                  <span>↓</span><span>Pull</span><span></span>
                </button>
                <button class="action-row" type="button">
                  <span>↑</span><span>Push</span><span></span>
                </button>
              </div>
            </section>

            <section class="action-section">
              <div class="section-title"><span>Selection</span><span>No file</span></div>
              <div class="action-stack">
                <button class="action-row disabled" type="button">
                  <span>O</span><span>Open in editor</span><span></span>
                </button>
                <button class="action-row disabled" type="button">
                  <span>✓</span><span>Stage file</span><span></span>
                </button>
                <button class="action-row disabled danger" type="button">
                  <span>D</span><span>Discard file</span><span></span>
                </button>
                <button class="action-row disabled" type="button">
                  <span>B</span><span>Prompt agent</span><span></span>
                </button>
                <button class="action-row disabled" type="button">
                  <span>M</span><span>Comment lines</span><span></span>
                </button>
              </div>
            </section>

            <section class="action-section">
              <div class="section-title"><span>PR / Operation</span><span>Active</span></div>
              <div class="action-stack">
                <button class="action-row" type="button">
                  <span>#</span><span>Open PR #42</span><span></span>
                </button>
                <button class="action-row" type="button">
                  <span>⇄</span><span>Squash merge</span><span></span>
                </button>
                <button class="action-row danger" type="button">
                  <span>X</span><span>Close PR</span><span></span>
                </button>
                <button class="action-row" type="button">
                  <span>C</span><span>Continue rebase</span><span></span>
                </button>
                <button class="action-row danger" type="button">
                  <span>A</span><span>Abort rebase</span><span></span>
                </button>
              </div>
            </section>
          </aside>

          <main class="workspace-only">
            <div class="file-toolbar">
              <div class="stack">
                <span class="label truncate">Staged changes</span>
                <span class="sub mono">No file selected</span>
              </div>
              <div class="view-group">
                <button class="icon-button active" type="button" title="Split">
                  <span>S</span>
                </button>
                <button class="icon-button" type="button" title="Stacked"><span>R</span></button>
                <button class="icon-button" type="button" title="Wrap"><span>W</span></button>
                <button class="select-button" type="button">Line info</button>
              </div>
            </div>
            <div class="diff-empty">
              <div class="diff-placeholder">
                <h2>Sidebar control tower</h2>
                <p>
                  The top bar stays thin. Git, file, review, PR, operation, history, stash, and
                  ignore-list actions live in the left control tower.
                </p>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
