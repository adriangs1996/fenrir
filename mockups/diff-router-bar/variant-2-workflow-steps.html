<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diff Router Bar - Variant 2 - Workflow Steps</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .workflow-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 8px 12px 10px;
      }

      .workflow-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
      }

      .route-strip {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .route-strip .repo {
        max-width: 32vw;
      }

      .workflow-steps {
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        gap: 8px;
      }

      .step-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        min-width: 0;
        height: 42px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #10151d;
        color: var(--muted);
      }

      .step-card.active {
        border-color: rgba(88, 201, 191, 0.45);
        background: #102027;
        color: #e9ffff;
      }

      .step-number {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 999px;
        background: #222b36;
        color: #d8e2ee;
        font-size: 11px;
        font-weight: 800;
      }

      .step-card.active .step-number {
        background: var(--teal);
        color: #06201c;
      }

      .quick-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .utility-strip {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      @media (max-width: 1180px) {
        .workflow-toolbar {
          grid-template-columns: 1fr;
        }

        .utility-strip {
          justify-content: flex-start;
        }

        .workflow-steps {
          grid-template-columns: repeat(2, minmax(130px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="window">
        <header class="toolbar workflow-toolbar">
          <div class="workflow-top">
            <div class="route-strip">
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3v12"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="6" cy="6" r="3"></circle>
                <path d="M18 6a3 3 0 1 0-3 3"></path>
                <path d="M6 15c4 0 9-3 9-6"></path>
              </svg>
              <span class="repo truncate mono">/Users/adriangonzalez/sandbox/t3code</span>
              <span>/</span>
              <span class="chip quiet">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 3v12"></path>
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="6" cy="6" r="3"></circle>
                  <path d="M18 6a3 3 0 1 0-3 3"></path>
                  <path d="M6 15c4 0 9-3 9-6"></path>
                </svg>
                master
              </span>
              <span class="status-dot"></span>
            </div>
            <div class="quick-actions">
              <button class="ghost-button" type="button" title="Pull from remote">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                Pull
              </button>
              <button class="ghost-button" type="button" title="Push to remote">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15V3"></path>
                  <path d="m17 8-5-5-5 5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                Push
              </button>
              <button class="icon-button" type="button" title="Refresh diff">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7"></path>
                  <path d="M3 12a9 9 0 0 1 15.1-6.6"></path>
                  <path d="M21 3v6h-6"></path>
                  <path d="M3 21v-6h6"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="workflow-steps" aria-label="Diff workflow">
            <button class="step-card active" type="button">
              <span class="step-number">1</span>
              <span class="stack">
                <span class="label truncate">Review changes</span>
                <span class="sub">Working tree and staged files</span>
              </span>
              <span class="badge">0</span>
            </button>
            <button class="step-card" type="button">
              <span class="step-number">2</span>
              <span class="stack">
                <span class="label truncate">Stage</span>
                <span class="sub">Choose files or hunks</span>
              </span>
              <span class="badge">0</span>
            </button>
            <button class="step-card" type="button">
              <span class="step-number">3</span>
              <span class="stack">
                <span class="label truncate">Commit</span>
                <span class="sub">No staged changes</span>
              </span>
              <span class="mini-meter" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
            </button>
            <button class="step-card" type="button">
              <span class="step-number">4</span>
              <span class="stack">
                <span class="label truncate">History</span>
                <span class="sub">Browse commits</span>
              </span>
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                <path d="M3 3v6h6"></path>
                <path d="M12 7v5l3 3"></path>
              </svg>
            </button>
          </div>

          <div class="utility-strip">
            <button class="select-button" type="button" title="Diff display preset">
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 21V14"></path>
                <path d="M4 10V3"></path>
                <path d="M12 21v-9"></path>
                <path d="M12 8V3"></path>
                <path d="M20 21v-5"></path>
                <path d="M20 12V3"></path>
                <path d="M2 14h4"></path>
                <path d="M10 8h4"></path>
                <path d="M18 16h4"></path>
              </svg>
              Split, inline, line info
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </button>
            <button class="chip" type="button" title="Current selection">
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <path d="M14 2v6h6"></path>
              </svg>
              No file selected
            </button>
          </div>
        </header>

        <div class="workbench">
          <aside class="sidebar">
            <div class="side-section">
              <div class="side-heading"><span>Review queue</span><span class="badge">0</span></div>
            </div>
            <div class="side-section">
              <div class="side-heading"><span>Stashes</span><span class="badge">0</span></div>
            </div>
          </aside>
          <main class="workspace">
            <div class="diff-empty">
              <div class="diff-placeholder">
                <h2>Review queue is empty</h2>
                <p>
                  The workflow bar keeps the active task visible and pushes display details behind a
                  preset menu.
                </p>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
