<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diff Router Bar - Variant 6 - Tabbed Action Bar</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .tabbed-toolbar {
        display: grid;
        grid-template-columns: minmax(230px, 0.55fr) minmax(360px, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
      }

      .repo-block {
        display: grid;
        min-width: 0;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c1118;
        padding: 0 9px;
      }

      .workspace-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(92px, 1fr));
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0c1118;
      }

      .workspace-tab {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        height: 30px;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        padding: 0 9px;
      }

      .workspace-tab.active {
        background: #202a38;
        color: #f4f8fb;
      }

      .utility-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 5px 12px 7px;
        border-top: 1px solid var(--line-soft);
        background: #101620;
      }

      .selection-strip {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        overflow: hidden;
      }

      .selection-pill {
        display: inline-grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        min-width: 240px;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151d27;
      }

      .dropdown-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .dropdown-menu {
        position: absolute;
        top: 92px;
        right: 330px;
        z-index: 20;
        width: 300px;
        border: 1px solid #354254;
        border-radius: 9px;
        background: #0d1219;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      }

      .menu-title {
        height: 34px;
        border-bottom: 1px solid var(--line-soft);
        padding: 8px 10px 0;
        color: #e7eef8;
        font-size: 12px;
        font-weight: 750;
      }

      .menu-list {
        display: grid;
        gap: 2px;
        padding: 6px;
      }

      .menu-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 7px;
        border-radius: 6px;
        background: transparent;
        color: #dce6f4;
        text-align: left;
      }

      .menu-row.active {
        background: #1b2533;
      }

      .menu-row.disabled {
        color: #667386;
      }

      .menu-row.danger {
        color: #ffb8b8;
      }

      .stats {
        font-family: var(--mono);
        font-size: 11px;
      }

      .add {
        color: #83e3ad;
      }

      .del {
        color: #ff9999;
      }

      @media (max-width: 1180px) {
        .tabbed-toolbar {
          grid-template-columns: minmax(0, 1fr);
        }

        .workspace-tabs {
          grid-template-columns: repeat(2, minmax(92px, 1fr));
        }

        .utility-row {
          grid-template-columns: 1fr;
        }

        .dropdown-menu {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="window">
        <header class="toolbar">
          <div class="tabbed-toolbar">
            <button class="repo-block" type="button" title="Switch repository">
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 4h18v14H3z"></path>
                <path d="M7 20h10"></path>
                <path d="M12 18v2"></path>
              </svg>
              <span class="stack">
                <span class="label truncate mono">t3code</span>
                <span class="sub mono">master - remote synced</span>
              </span>
              <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </button>

            <div class="workspace-tabs" aria-label="Diff workspace">
              <button class="workspace-tab active" type="button">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 6h13"></path>
                  <path d="M8 12h13"></path>
                  <path d="M8 18h13"></path>
                  <path d="M3 6h.01"></path>
                  <path d="M3 12h.01"></path>
                  <path d="M3 18h.01"></path>
                </svg>
                <span class="truncate">Worktree</span>
                <span class="badge">0</span>
              </button>
              <button class="workspace-tab" type="button">
                <span>PR</span>
                <span class="truncate">Stack</span>
                <span class="badge">3</span>
              </button>
              <button class="workspace-tab" type="button">
                <span>H</span>
                <span class="truncate">History</span>
                <span></span>
              </button>
              <button class="workspace-tab" type="button">
                <span>S</span>
                <span class="truncate">Stashes</span>
                <span class="badge">2</span>
              </button>
            </div>

            <div class="dropdown-group">
              <button class="primary-button" type="button">Stage all</button>
              <button class="chip" type="button">Commit</button>
              <button class="icon-button" type="button" title="Refresh">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7"></path>
                  <path d="M3 12a9 9 0 0 1 15.1-6.6"></path>
                  <path d="M21 3v6h-6"></path>
                  <path d="M3 21v-6h6"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="utility-row">
            <div class="selection-strip">
              <span class="selection-pill">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <path d="M14 2v6h6"></path>
                </svg>
                <span class="truncate">Staged changes - No file selected</span>
                <span class="stats"><span class="add">+0</span> <span class="del">-0</span></span>
              </span>
              <button class="chip" type="button">PR #42</button>
              <button class="chip warn" type="button">
                Rebase paused <span class="badge">2</span>
              </button>
            </div>
            <div class="dropdown-group">
              <button class="select-button active" type="button">Git actions</button>
              <button class="select-button" type="button">File actions</button>
              <button class="select-button" type="button">Review</button>
              <button class="select-button" type="button">View</button>
            </div>
          </div>
        </header>

        <div class="dropdown-menu">
          <div class="menu-title">Git actions</div>
          <div class="menu-list">
            <button class="menu-row active" type="button">
              <span>✓</span><span>Stage all working tree changes</span><span>0</span>
            </button>
            <button class="menu-row" type="button">
              <span>↶</span><span>Unstage all staged changes</span><span>0</span>
            </button>
            <button class="menu-row" type="button">
              <span>□</span><span>Stash current changes</span><span></span>
            </button>
            <button class="menu-row disabled" type="button">
              <span>●</span><span>Commit staged changes</span><span></span>
            </button>
            <button class="menu-row disabled" type="button">
              <span>↶</span><span>Amend last commit</span><span></span>
            </button>
            <button class="menu-row" type="button">
              <span>↓</span><span>Pull current branch</span><span></span>
            </button>
            <button class="menu-row" type="button">
              <span>↑</span><span>Push current branch</span><span></span>
            </button>
          </div>
        </div>

        <div class="workbench">
          <aside class="sidebar">
            <div class="side-section">
              <div class="side-heading"><span>Changes</span><span class="badge">0</span></div>
            </div>
            <div class="side-section">
              <div class="side-heading"><span>Working Tree</span><span class="badge">0</span></div>
            </div>
            <div class="side-section">
              <div class="side-heading"><span>Stashes</span><span class="badge">2</span></div>
            </div>
          </aside>
          <main class="workspace">
            <div class="diff-empty">
              <div class="diff-placeholder">
                <h2>Tabbed action bar</h2>
                <p>
                  Mode switching is explicit, while functionality sits in small scoped dropdown
                  menus.
                </p>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
