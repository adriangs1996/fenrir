<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- FENRIR — Icon Mark (jaw only)
       For app icons, favicons, menubar. No text, no chains.
       Catppuccin Mocha Green #a6e3a1 on Crust #11111b -->

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#11111b"/>

  <!-- Eyes -->
  <ellipse cx="80" cy="35" rx="6" ry="3" fill="#a6e3a1" opacity="0.9"/>
  <ellipse cx="120" cy="35" rx="6" ry="3" fill="#a6e3a1" opacity="0.9"/>

  <!-- Upper jaw -->
  <path d="M42,88 L58,55 L75,72 L88,40 L100,62 L112,40 L125,72 L142,55 L158,88"
        fill="none" stroke="#a6e3a1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Upper fangs -->
  <line x1="88" y1="40" x2="90" y2="90" stroke="#a6e3a1" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="40" x2="110" y2="90" stroke="#a6e3a1" stroke-width="4" stroke-linecap="round"/>

  <!-- Small upper teeth -->
  <line x1="75" y1="72" x2="77" y2="92" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="125" y1="72" x2="123" y2="92" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Lower jaw -->
  <path d="M48,112 L68,132 L88,118 L100,138 L112,118 L132,132 L152,112"
        fill="none" stroke="#a6e3a1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Lower fangs -->
  <line x1="88" y1="118" x2="89" y2="110" stroke="#a6e3a1" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="112" y1="118" x2="111" y2="110" stroke="#a6e3a1" stroke-width="3.5" stroke-linecap="round"/>
</svg>
