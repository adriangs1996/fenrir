<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const CATPPUCCIN_BACKGROUND = "#181825";
        const ROSE_PINE_BACKGROUND = "#191724";
        const KANAGAWA_BACKGROUND = "#1f1f28";
        const KANAGAWA_DRAGON_BACKGROUND = "#181616";
        const NORD_BACKGROUND = "#191c22";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("fenrir:theme");
          const theme =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            storedTheme === "catppuccin-mocha" ||
            storedTheme === "rose-pine" ||
            storedTheme === "kanagawa" ||
            storedTheme === "kanagawa-dragon" ||
            storedTheme === "nord"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isCatppuccin = theme === "catppuccin-mocha";
          const isRosePine = theme === "rose-pine";
          const isKanagawa = theme === "kanagawa";
          const isKanagawaDragon = theme === "kanagawa-dragon";
          const isNord = theme === "nord";
          const isDark =
            isCatppuccin ||
            isRosePine ||
            isKanagawa ||
            isKanagawaDragon ||
            isNord ||
            theme === "dark" ||
            (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("catppuccin-mocha", isCatppuccin);
          document.documentElement.classList.toggle("rose-pine", isRosePine);
          document.documentElement.classList.toggle("kanagawa", isKanagawa);
          document.documentElement.classList.toggle("kanagawa-dragon", isKanagawaDragon);
          document.documentElement.classList.toggle("nord", isNord);
          const chromeColor = isCatppuccin
            ? CATPPUCCIN_BACKGROUND
            : isRosePine
              ? ROSE_PINE_BACKGROUND
              : isKanagawa
                ? KANAGAWA_BACKGROUND
                : isKanagawaDragon
                  ? KANAGAWA_DRAGON_BACKGROUND
                  : isNord
                    ? NORD_BACKGROUND
                    : isDark
                      ? DARK_BACKGROUND
                      : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "Geist Mono",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          monospace;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      html.catppuccin-mocha body {
        background: #181825;
        color: #cdd6f4;
      }

      html.rose-pine body {
        background: #191724;
        color: #e0def4;
      }

      html.kanagawa body {
        background: #1f1f28;
        color: #dcd7ba;
      }

      html.kanagawa-dragon body {
        background: #181616;
        color: #c5c9c5;
      }

      html.nord body {
        background: #191c22;
        color: #eceff4;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Fenrir (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Fenrir splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Fenrir" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
